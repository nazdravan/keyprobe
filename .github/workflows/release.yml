name: Release

# Push to `main` → tests. If the version in Cargo.toml is not published yet → build every
# platform and publish the release "KeyProbe v<version>" (tag v<version>, with SHA256SUMS.txt)
# once all files are uploaded. Started by hand (workflow_dispatch): build + tests on any branch,
# artifacts only, no release. The steps are in docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test run, e.g. 0.2.0-rc.1 (empty: from Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      # true: build the packages (unpublished version, or a manual run).
      build: ${{ steps.published.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::\"$v\" is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### KeyProbe v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # A published release is never overwritten: if the version exists, a push only runs tests.
      - id: published
        name: Is the version already published?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          build=true
          if [ "$EVENT" = push ] &&
            draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" &&
            [ "$draft" != "true" ]; then
            build=false
            echo "KeyProbe v$VERSION is already published: tests only. For a new release: packaging/version.sh set <version>." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
      # The release notes come from CHANGELOG.md: without the version's section the builds
      # don't start (they would only fail at publishing).
      - name: Check CHANGELOG.md
        if: github.event_name == 'push' && steps.published.outputs.build == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: packaging/changelog.sh "$VERSION" >/dev/null

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for winit / eframe
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-test
      - run: cargo xtask ci

  linux:
    name: Linux x86_64
    needs: version
    if: needs.version.outputs.build == 'true'
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for winit / eframe
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux
      - name: Apply the test version
        if: inputs.version != ''
        run: packaging/version.sh set "$VERSION"
      - run: packaging/linux/package.sh
      - run: packaging/linux/appimage.sh
      - run: packaging/linux/deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows
      - name: Apply the test version
        if: inputs.version != ''
        shell: bash
        run: packaging/version.sh set "$VERSION"
      - name: Build and portable zip
        shell: pwsh
        run: packaging/windows/package.ps1
      - name: WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: The .msi installer
        shell: pwsh
        run: packaging/windows/msi.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos
      - name: Apply the test version
        if: inputs.version != ''
        run: packaging/version.sh set "$VERSION"
      - run: packaging/macos/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    # Only on a push to main, with every build and the tests green; manual runs stop after the builds.
    if: >-
      github.event_name == 'push' && needs.version.outputs.build == 'true' &&
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [version, test, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/changelog.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      # The release is created as a draft, gets all files, and only then is published, so nobody
      # sees it half-uploaded.
      - name: Publish the release
        working-directory: artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          title="KeyProbe v$VERSION"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag was already published (by an earlier run)."
              exit 1
            fi
            echo "A draft $tag is left over: replacing its files"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --title "$title" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$tag" --clobber -- *
          else
            # The CHANGELOG.md notes, followed by GitHub's generated list of commits.
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes -- *
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
          {
            echo "Published **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
