name: Pages

# The landing page https://nazdravan.github.io/keyprobe/ (source in site/), with the web build of
# KeyProbe under app/. Rebuilt after every successful Release run (a release published by Release
# doesn't start other workflows, so `on: release` can't be used), when the page, the changelog or
# the images change on `main`, and by hand. Links and news come from the latest published release.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - site/**
      - CHANGELOG.md
      - docs/assets/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Page tests
        run: |
          node --test 'site/tests/*.test.mjs'
          python3 -m unittest discover -s site/tests
      # Without a tag: the latest published release (not a draft, not a pre-release).
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,url,assets > release.json
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pages
      # Must match the wasm-bindgen version pinned in Cargo.lock.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.130
      - name: Web build
        run: cargo xtask web
      - name: Page
        run: python3 site/build.py --release release.json --out _site --app dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
