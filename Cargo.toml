[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kp-geom = { path = "crates/kp-geom" }
kp-doc = { path = "crates/kp-doc" }
kp-keys = { path = "crates/kp-keys" }
kp-engine = { path = "crates/kp-engine" }
kp-ui = { path = "crates/kp-ui" }
kp-control = { path = "crates/kp-control" }
png = "0.18"
egui = "0.37"
# Members choose features: desktop takes the defaults, web only glow.
eframe = { version = "0.37", default-features = false }
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"

# Rule 2: no panics outside tests (clippy.toml allows them in tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
